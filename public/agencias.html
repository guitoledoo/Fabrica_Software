<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agências - Gestão de Ativos TI</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">🖥️ Gestão de Ativos TI</div>
    <div class="navbar-menu">
  <a href="/index.html" class="nav-link">Dashboard</a>
  <a href="/ativos.html" class="nav-link">Ativos</a>
  <a href="/agencias.html" class="nav-link">Agências</a>
  <a href="/estoque.html" class="nav-link">Estoque</a>
  <a href="/historico.html" class="nav-link">Histórico</a>
  <a href="/usuarios.html" class="nav-link">Usuários</a>
</div>
    <div class="navbar-user">
      <span id="usuario-nome"></span>
      <button id="btn-logout" class="btn-logout">Sair</button>
    </div>
  </nav>

  <main class="container">
    <div class="cabecalho-pagina">
      <h1 class="titulo-pagina">🏢 Agências</h1>
      <button id="btn-novo" class="btn btn-primario">+ Nova Agência</button>
    </div>

    <div class="painel">
      <table class="tabela" id="tabela-agencias">
        <thead>
          <tr>
            <th>Código</th>
            <th>Nome</th>
            <th>CNPJ</th>
            <th>Total de Ativos</th>
            <th>Em Uso</th>
            <th>Em Estoque</th>
            <th>Manutenção</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Modal de criar/editar -->
  <div class="modal-fundo" id="modal-agencia">
    <div class="modal" style="max-width: 480px;">
      <div class="modal-cabecalho">
        <h3 id="modal-titulo">Nova Agência</h3>
        <button class="modal-fechar" onclick="fecharModal()">&times;</button>
      </div>
      <div class="modal-corpo">
        <form id="form-agencia">
          <div class="form-group">
            <label for="f-codigo">Código *</label>
            <input type="text" id="f-codigo" required placeholder="Ex: AG004" maxlength="10">
          </div>
          <div class="form-group">
            <label for="f-nome">Nome *</label>
            <input type="text" id="f-nome" required placeholder="Ex: Agência Centro">
          </div>
          <div class="form-group">
            <label for="f-endereco">Endereço</label>
            <input type="text" id="f-endereco" placeholder="Ex: Rua das Flores, 123">
          </div>
          <div class="form-group">
            <label for="f-cnpj">CNPJ</label>
            <input type="text" id="f-cnpj" placeholder="Ex: 12.345.678/0001-90">
          </div>
        </form>
      </div>
      <div class="modal-rodape">
        <button class="btn btn-secundario" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-primario" id="btn-salvar">Salvar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/app.js"></script>
  <script src="/js/agencias.js"></script>
</body>
</html>
