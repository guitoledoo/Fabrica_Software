<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque - Gestão de Ativos TI</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">🖥️ Gestão de Ativos TI</div>
    <div class="navbar-menu">
      <a href="/index.html" class="nav-link">Dashboard</a>
      <a href="/ativos.html" class="nav-link">Ativos</a>
      <a href="/agencias.html" class="nav-link">Agências</a>
      <a href="/estoque.html" class="nav-link ativo">Estoque</a>
      <a href="/historico.html" class="nav-link">Histórico</a>
    </div>
    <div class="navbar-user">
      <span id="usuario-nome"></span>
      <button id="btn-logout" class="btn-logout">Sair</button>
    </div>
  </nav>

  <main class="container">
    <div class="cabecalho-pagina">
      <h1 class="titulo-pagina">📦 Estoque de Insumos</h1>
      <button id="btn-movimentacao" class="btn btn-primario">+ Nova Movimentação</button>
    </div>

    <!-- Saldo atual -->
    <div class="painel">
      <h2>Saldo Atual por Item</h2>
      <table class="tabela" id="tabela-estoque">
        <thead>
          <tr>
            <th>Tag</th>
            <th>Descrição</th>
            <th>Categoria</th>
            <th>Entradas</th>
            <th>Saídas</th>
            <th>Saldo</th>
            <th>Mínimo</th>
            <th>Situação</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Últimas movimentações -->
    <div class="painel">
      <h2>Últimas Movimentações</h2>
      <table class="tabela" id="tabela-movimentacoes">
        <thead>
          <tr>
            <th>Data/Hora</th>
            <th>Tag</th>
            <th>Tipo</th>
            <th>Qtd.</th>
            <th>Origem/Destino</th>
            <th>Observação</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Modal de movimentação -->
  <div class="modal-fundo" id="modal-mov">
    <div class="modal" style="max-width: 520px;">
      <div class="modal-cabecalho">
        <h3>Nova Movimentação</h3>
        <button class="modal-fechar" onclick="fecharModal()">&times;</button>
      </div>
      <div class="modal-corpo">
        <form id="form-mov">
          <div class="form-group">
            <label for="m-tipo">Tipo *</label>
            <select id="m-tipo">
              <option value="Entrada">Entrada (recebimento)</option>
              <option value="Saída">Saída (entrega)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="m-tag">Item *</label>
            <select id="m-tag"></select>
          </div>
          <div class="form-group">
            <label for="m-quantidade">Quantidade *</label>
            <input type="number" id="m-quantidade" min="1" value="1" required>
          </div>
          <!-- Campos de ENTRADA -->
          <div class="grupo-entrada">
            <div class="form-group">
              <label for="m-quem-entregou">Quem entregou</label>
              <input type="text" id="m-quem-entregou" placeholder="Ex: Dell Brasil">
            </div>
            <div class="form-group">
              <label for="m-setor-entrada">Setor de destino</label>
              <input type="text" id="m-setor-entrada" placeholder="Ex: Almoxarifado TI">
            </div>
          </div>
          <!-- Campos de SAÍDA -->
          <div class="grupo-saida" style="display:none;">
            <div class="form-group">
              <label for="m-para-quem">Entregue para</label>
              <input type="text" id="m-para-quem" placeholder="Ex: joao.silva">
            </div>
            <div class="form-group">
              <label for="m-setor-saida">Setor de origem</label>
              <input type="text" id="m-setor-saida" placeholder="Ex: Almoxarifado TI">
            </div>
          </div>
          <div class="form-group">
            <label for="m-descricao">Observação</label>
            <input type="text" id="m-descricao" placeholder="Ex: NF 12345 / Reposição mensal">
          </div>
        </form>
      </div>
      <div class="modal-rodape">
        <button class="btn btn-secundario" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-primario" id="btn-salvar">Registrar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/app.js"></script>
  <script src="/js/estoque.js"></script>
</body>
</html>
